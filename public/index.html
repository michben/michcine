<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" href="/api/favicon">
<link rel="apple-touch-icon" href="/api/favicon">
<meta name="theme-color" content="#0A0C16">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MichBen Ciné Quizz — devinez le film</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0A0C16;--velvet:#151A2E;--card:#1C2238;--beam:#F5B942;--ticket:#E4586E;--teal:#4ECDC4;--chalk:#EDE8DC;--muted:#7C819B}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ink);color:var(--chalk);
    font-family:'Space Grotesk',system-ui,sans-serif;
    background-image:radial-gradient(ellipse 80% 55% at 50% -10%, rgba(245,185,66,.16), transparent 70%)}
  .wrap{max-width:720px;margin:0 auto;padding:26px 18px 40px}
  h1{font-family:'Anton',sans-serif;font-size:clamp(30px,8vw,52px);letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:.92}
  h1 em{font-style:normal;color:var(--beam)}
  .hidden{display:none!important}
  button{background:var(--beam);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
  button.ghost{background:transparent;color:var(--chalk);border:1px solid rgba(237,232,220,.2)}
  input{width:100%;background:var(--card);border:1px solid rgba(237,232,220,.14);color:var(--chalk);border-radius:10px;padding:12px 14px;font-size:16px;margin-top:6px}
  .card{background:var(--velvet);border:1px solid rgba(237,232,220,.09);border-radius:14px;padding:20px;margin-top:16px}
  .tag{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .row{display:flex;gap:10px;margin-top:14px}
  .feedback{margin-top:10px;font-size:14px}.feedback.bad{color:var(--ticket)}
  .xbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#000;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 18px}
  /* Navbar */
  .navbar{display:flex;justify-content:space-around;background:var(--velvet);padding:10px;border-radius:12px;margin-top:20px}
  .navbar button{background:transparent;color:var(--chalk);border:0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <button id="banner" style="background:none;border:0;cursor:pointer;padding:0;text-align:left">
    <h1>MichBen <em>Ciné Quizz</em></h1>
  </button>

  <!-- ACCUEIL / CONNEXION -->
  <section id="landing">
    <p class="baseline" style="margin-top:10px">Un synopsis s'affiche, vous devinez le film. Plus vous répondez vite, plus vous marquez.</p>
    <div class="card">
      <p class="tag">Connexion</p>
      <div class="row" style="flex-direction:column">
        <a class="xbtn" href="/auth/x/login">𝕏 &nbsp;Se connecter avec X</a>
        <button class="ghost" onclick="show('manualLogin')">Connexion Identifiant</button>
      </div>
      <p class="tag" style="margin:22px 0 10px">Ou avec une adresse email</p>
      <label for="mail">Email</label>
      <input id="mail" type="email" placeholder="vous@exemple.fr">
      <label for="mdp" style="margin-top:12px">Mot de passe</label>
      <input id="mdp" type="password" placeholder="Mot de passe">
      <div class="row">
        <button id="btnMailConnexion">Se connecter</button>
        <button id="btnMailInscription" class="ghost">Créer un compte</button>
      </div>
      <p class="feedback bad" id="mailError"></p>
    </div>
  </section>

  <!-- CONNEXION MANUELLE -->
  <section id="manualLogin" class="hidden">
    <div class="card">
      <p class="tag">Connexion Identifiant</p>
      <label for="manId">Identifiant</label>
      <input id="manId" placeholder="monid">
      <label for="manMdp" style="margin-top:12px">Mot de passe</label>
      <input id="manMdp" type="password" placeholder="••••">
      <div class="row">
        <button id="btnManConnexion">Se connecter</button>
      </div>
      <p class="feedback bad" id="manError"></p>
      <button class="ghost" id="btnManBack" style="margin-top:10px">Retour</button>
    </div>
  </section>

  <!-- MENU PRINCIPAL (JEU) -->
  <section id="menu" class="hidden">
    <div class="card">
      <h2 id="hello">Bonjour</h2>
      <div class="navbar" id="barreNavigation">
        <button id="btnHome">🏠 Accueil</button>
        <button id="btnFriends">👥 Amis</button>
        <button id="btnToggleMode" title="Mode Enfant">🧸</button>
        <button id="btnProfile">👤 Profil</button>
      </div>
    </div>
  </section>
</div>

<script>
const sections = ["landing", "manualLogin", "menu"];
function show(id) {
  sections.forEach(s => {
    const el = document.getElementById(s);
    if (el) el.classList.toggle("hidden", s !== id);
  });
}

document.getElementById("btnManBack").onclick = () => show("landing");

// Simulation session check
async function checkSession() {
  try {
    const res = await fetch("/api/me");
    if (res.ok) {
      const user = await res.json();
      document.getElementById("hello").textContent = `Bonjour ${user.pseudo || 'Cinéphile'}`;
      show("menu");
    } else {
      show("landing");
    }
  } catch {
    show("landing");
  }
}
checkSession();

// Mode Enfant Toggle
let modeEnfant = localStorage.getItem("michben_mode") === "kid";
const btnBear = document.getElementById("btnToggleMode");
if (btnBear) {
  btnBear.style.opacity = modeEnfant ? "1" : "0.5";
  btnBear.onclick = () => {
    modeEnfant = !modeEnfant;
    localStorage.setItem("michben_mode", modeEnfant ? "kid" : "adult");
    btnBear.style.opacity = modeEnfant ? "1" : "0.5";
    alert(modeEnfant ? "Mode Enfant activé 🧸" : "Mode Enfant désactivé");
  };
}
</script>
</body>
</html>
