<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MichBen Ciné Quizz</title>
<style>
  :root{--ink:#0A0C16;--velvet:#151A2E;--beam:#F5B942;--chalk:#EDE8DC}
  body{margin:0;background:var(--ink);color:var(--chalk);font-family:sans-serif;}
  .hidden{display:none!important}
  .wrap{max-width:720px;margin:0 auto;padding:20px}
  .card{background:var(--velvet);padding:20px;border-radius:12px;margin-top:20px}
  .navbar{display:flex;justify-content:space-between;padding:15px;background:var(--velvet);margin-top:20px;border-radius:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="mainTitle">MichBen Ciné Quizz</h1>

  <!-- ÉCRAN ACCUEIL (masqué si connecté) -->
  <section id="landing">
    <div class="card">
      <h2>Connexion</h2>
      <a href="/auth/x/login">Se connecter avec X</a>
      <hr>
      <label>Email</label>
      <input id="mail" type="email">
      <label>Mot de passe</label>
      <input id="mdp" type="password">
      <button id="btnMailConnexion">Se connecter</button>
      <button id="btnToggleMode" style="margin-top:20px">🧸 Mode Enfant</button>
    </div>
  </section>

  <!-- MENU PRINCIPAL (masqué si non connecté) -->
  <section id="menu" class="hidden">
    <div class="card">
      <h2 id="hello">Bonjour</h2>
      <div class="navbar">
        <button onclick="show('menu')">🏠</button>
        <button id="btnFriends">👥</button>
        <button id="btnToggleModeMenu">🧸</button>
        <button id="btnProfile">👤</button>
      </div>
    </div>
  </section>
</div>

<script>
const sections = ["landing", "menu"];
function show(id) {
  sections.forEach(s => {
    const el = document.getElementById(s);
    if (el) el.classList.toggle("hidden", s !== id);
  });
}

// Vérifier session
fetch("/api/me").then(r => {
  if (r.ok) {
    r.json().then(u => {
      document.getElementById("hello").textContent = "Bonjour " + u.pseudo;
      show("menu");
    });
  } else {
    show("landing");
  }
});

// Logique Mode Enfant
const toggleMode = () => {
  const isKid = localStorage.getItem("michben_mode") === "kid";
  const newMode = isKid ? "adult" : "kid";
  localStorage.setItem("michben_mode", newMode);
  alert("Mode passé en : " + newMode);
};
document.getElementById("btnToggleMode").onclick = toggleMode;
document.getElementById("btnToggleModeMenu").onclick = toggleMode;
</script>
</body>
</html>
