<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" href="/api/favicon">
<link rel="apple-touch-icon" href="/api/favicon">
<meta name="theme-color" content="#0A0C16">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MichBen Ciné Quizz — devinez le film</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0A0C16;--velvet:#151A2E;--card:#1C2238;--beam:#F5B942;--ticket:#E4586E;--teal:#4ECDC4;--chalk:#EDE8DC;--muted:#7C819B}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ink);color:var(--chalk);
    font-family:'Space Grotesk',system-ui,sans-serif;
    background-image:radial-gradient(ellipse 80% 55% at 50% -10%, rgba(245,185,66,.16), transparent 70%)}
  .wrap{max-width:720px;margin:0 auto;padding:26px 18px 40px}
  h1{font-family:'Anton',sans-serif;font-size:clamp(30px,8vw,52px);letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:.92}
  h1 em{font-style:normal;color:var(--beam)}
  h2{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:22px;margin:0 0 4px}
  .baseline{color:var(--muted);font-size:16px;margin:10px 0 0;line-height:1.5;max-width:44ch}
  .card{background:var(--velvet);border:1px solid rgba(237,232,220,.09);border-radius:14px;padding:20px;margin-top:16px}
  .tag{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  label{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  input{width:100%;background:var(--card);border:1px solid rgba(237,232,220,.14);color:var(--chalk);border-radius:10px;padding:13px 14px;font:inherit;font-size:16px}
  button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px 18px;cursor:pointer;background:var(--beam);color:#161207}
  button.ghost{background:transparent;color:var(--chalk);border:1px solid rgba(237,232,220,.22)}
  button.danger{color:var(--ticket);border-color:rgba(228,88,110,.45)}
  .row{display:flex;gap:10px;margin-top:14px}.row>*{flex:1}
  .hidden{display:none !important}
  .wallet{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);background:var(--card);border-radius:999px;padding:7px 14px;margin-top:10px}
  .wallet b{color:var(--beam);font-family:'JetBrains Mono',monospace;font-size:15px}
  .online{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-top:10px}
  .online b{color:#3DDC84;font-family:'JetBrains Mono',monospace;font-size:16px}
  .dot{width:8px;height:8px;border-radius:50%;background:#3DDC84;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <button id="banner" style="background:none;border:0;cursor:pointer;padding:0;text-align:left">
    <h1>MichBen <em>Ciné Quizz</em></h1>
  </button>

  <!-- ACCUEIL -->
  <section id="landing">
    <p class="baseline">Un synopsis s'affiche, vous devinez le film. Plus vous répondez vite, plus vous marquez.</p>
    <div class="card">
      <p class="tag">Connexion</p>
      <div class="row" style="flex-direction:column">
        <a class="xbtn" href="/auth/x/login" style="display:block;text-align:center;text-decoration:none;font-weight:700;font-size:16px;background:var(--chalk);color:#0A0C16;border-radius:10px;padding:14px 18px;">𝕏 &nbsp;Se connecter avec X</a>
      </div>
      <p class="tag" style="margin:22px 0 10px">Ou avec une adresse email</p>
      <label for="mail">Email</label>
      <input id="mail" type="email" placeholder="vous@exemple.fr">
      <label for="mdp" style="margin-top:12px">Mot de passe</label>
      <input id="mdp" type="password" placeholder="8 caractères minimum">
      <div class="row">
        <button id="btnMailConnexion">Se connecter</button>
      </div>
      <p class="feedback bad" id="mailError" style="color:var(--ticket);margin-top:10px;"></p>
    </div>
  </section>

  <!-- MENU PRINCIPAL -->
  <section id="menu" class="hidden">
    <h2 id="hello">Bonjour</h2>
    <p class="wallet">🎟️ <b id="creditsCount">0</b> crédits</p>
    <p class="online"><span class="dot"></span><b id="onlineNb">1</b> joueur en ligne</p>

    <!-- BARRE DE NAVIGATION : AMIS, OURSON (MODE ENFANT), PROFIL -->
    <div class="row" style="margin: 20px 0;">
      <button class="ghost" id="btnFriends" style="flex:1;">👥 Amis</button>
      <!-- LE BOUTON OURSON EXACTEMENT ENTRE AMIS ET PROFIL -->
      <button class="ghost" id="btnToggleMode" title="Basculer Mode Enfant / Adulte" style="flex:0 0 auto; border-color:var(--teal); color:var(--teal); font-size:22px; padding:10px 16px;">🧸</button>
      <button class="ghost" id="btnProfile" style="flex:1;">👤 Profil</button>
    </div>

    <div class="card">
      <p class="tag">Mode de jeu</p>
      <button style="width:100%;margin-bottom:10px;" id="btnSolo">🎬 Solo</button>
      <button style="width:100%;background:var(--teal);color:#0A0C16;" id="btnAdminAccess" class="hidden">⚙️ Administration</button>
    </div>
  </section>
</div>

<script>
const show = (id) => {
  ["landing", "menu"].forEach(s => {
    const el = document.getElementById(s);
    if (el) el.classList.toggle("hidden", s !== id);
  });
  window.scrollTo({top: 0, behavior: "instant"});
};

// Vérification de session
fetch("/api/me").then(r => {
  if (r.ok) {
    r.json().then(u => {
      document.getElementById("hello").textContent = `Bonjour ${u.pseudo || 'Cinéphile'}`;
      if (u.role === "admin" || u.role === "moderateur") {
        document.getElementById("btnAdminAccess").classList.remove("hidden");
        document.getElementById("btnAdminAccess").onclick = () => location.href = "/admin.html";
      }
      show("menu");
    });
  } else {
    show("landing");
  }
}).catch(() => show("landing"));

// Connexion Email
document.getElementById("btnMailConnexion").onclick = async () => {
  const email = document.getElementById("mail").value.trim();
  const motDePasse = document.getElementById("mdp").value;
  if (!email || !motDePasse) {
    document.getElementById("mailError").textContent = "Renseignez l'email et le mot de passe.";
    return;
  }
  const res = await fetch("/auth/email/connexion", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ email, motDePasse })
  });
  if (res.ok) {
    location.reload();
  } else {
    document.getElementById("mailError").textContent = "Identifiants invalides.";
  }
};

// Gestion du Mode Enfant (Ourson 🧸)
let modeEnfant = localStorage.getItem("michben_mode") === "kid";
const btnBear = document.getElementById("btnToggleMode");
if (btnBear) {
  btnBear.style.background = modeEnfant ? "var(--teal)" : "transparent";
  btnBear.style.color = modeEnfant ? "#161207" : "var(--chalk)";
  btnBear.onclick = () => {
    modeEnfant = !modeEnfant;
    localStorage.setItem("michben_mode", modeEnfant ? "kid" : "adult");
    btnBear.style.background = modeEnfant ? "var(--teal)" : "transparent";
    btnBear.style.color = modeEnfant ? "#161207" : "var(--chalk)";
    alert(modeEnfant ? "🧸 Mode Enfant activé ! (Films adaptés)" : "👤 Mode Adulte activé !");
  };
}

// Lancement Solo avec prise en compte du mode enfant
document.getElementById("btnSolo").onclick = async () => {
  const categorie = localStorage.getItem("michben_mode") === "kid" ? "kid" : "tous";
  const res = await fetch("/api/solo/start", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ mode: "solo", categorie })
  });
  if (res.ok) {
    alert("Partie solo lancée en mode " + categorie + " !");
  } else {
    alert("Erreur au lancement de la partie.");
  }
};
</script>
</body>
</html>
